<title>Alternativen</title>

<style>
  body { margin:0; padding:32px; background:#1b1d22; color:#e9ecf1; font-family:'Archivo Variable', sans-serif; }
  .grid { display:grid; grid-template-columns: repeat(2, 648px); gap:40px 32px; }
  figure { margin:0; }
  .frame { width:648px; height:405px; overflow:hidden; border:1px solid rgba(233,236,241,.15); }
  iframe { width:1440px; height:900px; border:0; transform:scale(.45); transform-origin:0 0; }
  figcaption { margin-top:12px; font-size:15px; line-height:1.5; color:#aeb4bf; max-width:62ch; }
  figcaption b { display:block; color:#e9ecf1; font-stretch:112.5%; font-weight:500; font-size:19px; margin-bottom:2px; }
  a { color:inherit; }
</style>
</head>
<body>
<div class="grid">
  <figure><div class="frame"><iframe src="assigned.html" title="A"></iframe></div>
    <figcaption><b>A · Ordner (ausgewürfelt)</b>Ein aufgeschlagener Leitz-Ordner: Deckblatt, abgeheftete Projektblätter, farbige Registerblätter als Navigation. Ruhig, geordnet, sehr deutsch. <a href="assigned.html">öffnen</a></figcaption></figure>
  <figure><div class="frame"><iframe src="model-pick.html" title="B"></iframe></div>
    <figcaption><b>B · Bauanleitung (meine Wahl)</b>Jedes Projekt als Lego-/Fischertechnik-Anleitung: Teileliste (Technologien), nummerierte Bauschritte, das Modell daneben. <a href="model-pick.html">öffnen</a></figcaption></figure>
  <figure><div class="frame"><iframe src="challenger-hypercard.html" title="C"></iframe></div>
    <figcaption><b>C · HyperCard-Stapel</b>1-Bit schwarz auf weiß, eine Karte nach der anderen, Knöpfe führen weiter. Lesen und Bauen im selben Werkzeug. <a href="challenger-hypercard.html">öffnen</a></figcaption></figure>
  <figure><div class="frame"><iframe src="challenger-crouwel.html" title="D"></iframe></div>
    <figcaption><b>D · Raster</b>Wim Crouwel: das CSS-Grid sichtbar als Gerüst, die Initialen aus Rasterzellen gebaut, eine orange Fläche als einziger Akzent. <a href="challenger-crouwel.html">öffnen</a></figcaption></figure>
</div>
</body>
</html>

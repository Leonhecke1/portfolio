<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A · Ruhiges Feld</title>
<link rel="stylesheet" href="/node_modules/@fontsource-variable/archivo/wdth.css">
<link rel="stylesheet" href="/node_modules/@fontsource-variable/martian-mono/standard.css">
<style>
  :root { --ground:#04050a; --ink:#e9ecf1; --ink-2:#aeb4bf; --ink-3:#828a98; --work:#e8b04a; }
  html, body { margin:0; height:100%; background:var(--ground); color:var(--ink); font-family:'Archivo Variable', sans-serif; }
  .field { position:relative; height:100vh; overflow:hidden; }
  .plate { position:absolute; inset:-4%; background:url(/field/smacs0723-2400.jpg) 58% 40% / cover; filter:brightness(.5) saturate(.75); }
  .field::after { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 75% 70% at 50% 50%, transparent 40%, rgba(4,5,10,.7) 100%), linear-gradient(to bottom, rgba(4,5,10,.6), transparent 30%); }
  header { position:absolute; inset:0 0 auto 0; display:flex; justify-content:flex-end; gap:28px; padding:22px 40px; z-index:3; }
  header a { font-stretch:75%; font-weight:600; font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); text-decoration:none; }
  .title { position:absolute; left:40px; bottom:120px; z-index:3; max-width:560px; }
  h1 { margin:0; font-stretch:125%; font-weight:300; font-size:88px; line-height:.92; letter-spacing:-.03em; }
  .title p { margin:20px 0 0; font-size:18px; line-height:1.55; color:var(--ink-2); max-width:44ch; }
  .mark { position:absolute; z-index:2; transform:translate(-50%,-50%); }
  .mark i { display:block; border:1px solid rgba(232,176,74,.55); border-radius:50%; }
  .mark span { position:absolute; left:calc(100% + 14px); top:50%; transform:translateY(-50%); white-space:nowrap; font-stretch:87.5%; font-weight:500; font-size:15px; color:var(--ink-2); }
  .mark.on i { border-color:var(--work); border-width:1.5px; }
  .mark.on span { color:var(--ink); }
  nav.tabs { position:absolute; right:40px; bottom:48px; z-index:3; display:flex; gap:28px; }
  nav.tabs a { font-size:15px; color:var(--ink-3); text-decoration:none; padding-bottom:6px; }
  nav.tabs a.on { color:var(--ink); border-bottom:1px solid var(--work); }
  .credit { position:absolute; left:40px; bottom:48px; z-index:3; font-family:'Martian Mono Variable', monospace; font-stretch:87.5%; font-size:10px; color:var(--ink-3); }
</style>
</head>
<body>
<section class="field">
  <div class="plate"></div>
  <header><a href="#">Arbeit</a><a href="#">Werdegang</a><a href="#">Kontakt</a><a href="#">EN</a></header>
  <div class="mark on" style="left:61%;top:30%"><i style="width:96px;height:96px"></i><span>CSS Grid Generator</span></div>
  <div class="mark" style="left:50%;top:56%"><i style="width:120px;height:120px"></i><span>Planetary Dashboard</span></div>
  <div class="mark" style="left:83%;top:44%"><i style="width:84px;height:84px"></i><span>WIP Sandbox</span></div>
  <div class="title">
    <h1>Leon Hecke</h1>
    <p>Frontend-Entwickler. Drei Projekte liegen in diesem Feld – wähle eins aus, um es zu öffnen.</p>
  </div>
  <p class="credit">SMACS 0723 · NASA, ESA, CSA, STScI · CC BY 4.0</p>
  <nav class="tabs"><a class="on" href="#">Arbeit</a><a href="#">Werdegang</a><a href="#">Können</a></nav>
</section>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alternativen</title>
<link rel="stylesheet" href="/node_modules/@fontsource-variable/archivo/wdth.css">
<style>
  body { margin:0; padding:32px; background:#1b1d22; color:#e9ecf1; font-family:'Archivo Variable', sans-serif; }
  .grid { display:grid; grid-template-columns: repeat(2, 648px); gap:40px 32px; }
  figure { margin:0; }
  .frame { width:648px; height:405px; overflow:hidden; border:1px solid rgba(233,236,241,.15); }
  iframe { width:1440px; height:900px; border:0; transform:scale(.45); transform-origin:0 0; }
  figcaption { margin-top:12px; font-size:15px; line-height:1.5; color:#aeb4bf; max-width:62ch; }
  figcaption b { display:block; color:#e9ecf1; font-stretch:112.5%; font-weight:500; font-size:19px; margin-bottom:2px; }
  a { color:inherit; }
</style>
</head>
<body>
<div class="grid">
  <figure><div class="frame"><iframe src="a-ruhiges-feld.html" title="A"></iframe></div>
    <figcaption><b>A · Ruhiges Feld</b>Dieselbe Idee, stark zurückgenommen: gedimmtes Foto, nur drei Projekte, keine Instrumente. <a href="a-ruhiges-feld.html">öffnen</a></figcaption></figure>
  <figure><div class="frame"><iframe src="b-okular.html" title="B"></iframe></div>
    <figcaption><b>B · Okular</b>Ein Projekt auf einmal: ein runder Teleskopblick, Scrollen schwenkt zum nächsten Objekt. Linear, sehr ruhig. <a href="b-okular.html">öffnen</a></figcaption></figure>
  <figure><div class="frame"><iframe src="c-glasplatte.html" title="C"></iframe></div>
    <figcaption><b>C · Glasplatte</b>Hell statt dunkel: das Feld als Negativ wie auf alten Astronomie-Glasplatten, Projekte von Hand in Rot markiert. <a href="c-glasplatte.html">öffnen</a></figcaption></figure>
  <figure><div class="frame"><iframe src="d-horizont.html" title="D"></iframe></div>
    <figcaption><b>D · Horizont</b>Klassisch: das Feld als ruhiger Bildstreifen, darunter Name, Satz und ein Button. Am wenigsten Erlebnis, am klarsten. <a href="d-horizont.html">öffnen</a></figcaption></figure>
</div>
</body>
</html>

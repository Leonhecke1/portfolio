<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#04050a;font-family:"Helvetica Neue",Arial,sans-serif;color:#e9ecf1}
.field{position:absolute;inset:0;background:
radial-gradient(ellipse 60px 22px at 22% 30%,#f2c27a 0,#a8622f 40%,transparent 75%),
radial-gradient(ellipse 34px 34px at 64% 22%,#ffe2b0 0,#c46a3a 45%,transparent 80%),
radial-gradient(ellipse 90px 30px at 48% 58%,#f6d7a0 0,#b5503e 40%,transparent 80%),
radial-gradient(ellipse 26px 14px at 78% 64%,#e6b0ff 0,#7a3fa0 50%,transparent 85%),
radial-gradient(ellipse 40px 40px at 30% 74%,#bfe8ff 0,#3b6fa0 45%,transparent 85%),
radial-gradient(ellipse 22px 22px at 86% 36%,#fff 0,#e8b04a 35%,transparent 75%),
radial-gradient(circle at 50% 50%,#0b0d18,#04050a)}
.ret{position:absolute;border:1px solid #e9ecf1;border-radius:50%;opacity:.8}
.lab{position:absolute;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#e9ecf1}
.lab b{display:block;font-size:22px;letter-spacing:0;text-transform:none;font-weight:500}
h1{position:absolute;left:48px;top:40px;margin:0;font-weight:300;font-size:64px;letter-spacing:-.02em}
.meta{position:absolute;left:48px;top:118px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.read{position:absolute;right:48px;top:44px;text-align:right;font:13px/1.6 ui-monospace,Menlo,monospace;opacity:.8}
.wheel{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);display:flex;gap:2px}
.wheel span{padding:14px 26px;border:1px solid #e9ecf1;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.wheel span.on{background:#e8b04a;color:#04050a;border-color:#e8b04a}
</style></head><body><div class="field"></div>
